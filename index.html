<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外贸订单退税金额在线测算表</title>
  <style>
    :root { --ink: #112018; --muted: #66746a; --line: #b9cdbf; --grid: #dfeadf; --paper: #fbfff9; --panel: #eef8ed; --panel-2: #d7efd8; --accent: #187a3f; --accent-2: #ffb800; --danger: #a83a32; --white: #ffffff; --shadow: 0 18px 45px rgba(20, 55, 31, .13); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif; background: radial-gradient(circle at 12% 8%, rgba(255,184,0,.18), transparent 28%), linear-gradient(135deg, #f4fff2 0%, #eef9ee 42%, #fffdf2 100%); color: var(--ink); padding: 28px; }
    .shell { max-width: 1520px; margin: 0 auto; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
  <script>
    // 初始化 Supabase 并确保全局可用
    const supabaseUrl = 'https://fswvklhzhmxlksaujjdx.supabase.co';
    const supabaseKey = 'sb_publishable_Jq7ON0RXGU37LrC25dZh5Q_fq12N9SI';
    window.supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 登录/注册/登出函数
    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      console.log('注册触发', email);
      const { data, error } = await window.supabase.auth.signUp({ email, password });
      if (error) console.error(error);
      else console.log(data);
      alert(error ? error.message : '注册成功，请检查邮箱验证');
      updateUserInfo();
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      console.log('登录触发', email);
      const { data, error } = await window.supabase.auth.signInWithPassword({ email, password });
      if (error) console.error(error);
      else console.log(data);
      alert(error ? error.message : '登录成功');
      updateUserInfo();
    }

    async function signOut() {
      console.log('登出触发');
      await window.supabase.auth.signOut();
      updateUserInfo();
    }

    async function updateUserInfo() {
      const { data } = await window.supabase.auth.getUser();
      console.log('当前用户:', data.user);
      document.getElementById('userInfo').textContent = data.user ? `已登录: ${data.user.email}` : '未登录';
    }

    // 动态绑定按钮事件，确保脚本加载完成后才触发
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btnSignUp').addEventListener('click', signUp);
      document.getElementById('btnSignIn').addEventListener('click', signIn);
      document.getElementById('btnSignOut').addEventListener('click', signOut);
    });

    // 原有计算功能、云端保存函数保留
  </script>
</head>
<body>
  <!-- 登录区域 -->
  <div id="authContainer" style="margin-bottom:20px;">
    <input id="email" placeholder="邮箱">
    <input id="password" type="password" placeholder="密码">
    <button id="btnSignUp">注册</button>
    <button id="btnSignIn">登录</button>
    <button id="btnSignOut">登出</button>
    <span id="userInfo" style="margin-left:10px;"></span>
  </div>

  <main class="shell">
    <!-- 原 HTML 内容保持不变 -->
  </main>
</body>
</html>
