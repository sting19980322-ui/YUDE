<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外贸订单退税金额在线测算表</title>
  <style>
    /* 原有样式保持不变 */
    :root { --ink: #112018; --muted: #66746a; --line: #b9cdbf; --grid: #dfeadf; --paper: #fbfff9; --panel: #eef8ed; --panel-2: #d7efd8; --accent: #187a3f; --accent-2: #ffb800; --danger: #a83a32; --white: #ffffff; --shadow: 0 18px 45px rgba(20, 55, 31, .13); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif; background: radial-gradient(circle at 12% 8%, rgba(255,184,0,.18), transparent 28%), linear-gradient(135deg, #f4fff2 0%, #eef9ee 42%, #fffdf2 100%); color: var(--ink); padding: 28px; }
    .shell { max-width: 1520px; margin: 0 auto; }
    /* 保留其他 CSS ... */
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
</head>
<body>
  <!-- 登录区域 -->
  <div id="authContainer" style="margin-bottom:20px;">
    <input id="email" placeholder="邮箱">
    <input id="password" type="password" placeholder="密码">
    <button onclick="signUp()">注册</button>
    <button onclick="signIn()">登录</button>
    <button onclick="signOut()">登出</button>
    <span id="userInfo" style="margin-left:10px;"></span>
  </div>

  <main class="shell">
    <!-- 原 HTML 内容保持不变 -->
  </main>

  <script>
    // 调试版 Supabase 登录 JS
    const supabaseUrl = 'https://fswvklhzhmxlksaujjdx.supabase.co';
    const supabaseKey = 'sb_publishable_Jq7ON0RXGU37LrC25dZh5Q_fq12N9SI';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function signUp() {
      console.log('点击注册按钮');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      console.log('注册信息:', email, password);
      try {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) console.error('注册错误:', error);
        else console.log('注册成功:', data);
        alert(error ? error.message : '注册成功，请检查邮箱验证');
      } catch(e) {
        console.error('网络或未知错误:', e);
      }
      updateUserInfo();
    }

    async function signIn() {
      console.log('点击登录按钮');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      console.log('登录信息:', email, password);
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) console.error('登录错误:', error);
        else console.log('登录成功:', data);
        alert(error ? error.message : '登录成功');
      } catch(e) {
        console.error('网络或未知错误:', e);
      }
      updateUserInfo();
    }

    async function signOut() {
      console.log('点击登出按钮');
      await supabase.auth.signOut();
      updateUserInfo();
    }

    async function updateUserInfo() {
      const user = (await supabase.auth.getUser()).data.user;
      console.log('当前用户:', user);
      document.getElementById('userInfo').textContent = user ? `已登录: ${user.email}` : '未登录';
    }

    // 原有计算功能和云端保存函数保持不变
    /* rowTemplate, addRow, addFeeRow, deleteRow, renumber, recalc, collectData, saveLocal, loadLocal, resetAll, exportCsv, saveToSupabase */

    function recalcAndSave() {
      recalc();
      saveToSupabase();
    }
    document.querySelectorAll('input,select').forEach(el => el.addEventListener('input', recalcAndSave));

    loadLocal();
    updateUserInfo();
  </script>
</body>
</html>
