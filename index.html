<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外贸订单退税金额在线测算表</title>
  <style>
    :root {
      --ink: #112018; --muted: #66746a; --line: #b9cdbf; --grid: #dfeadf;
      --paper: #fbfff9; --panel: #eef8ed; --panel-2: #d7efd8; --accent: #187a3f;
      --accent-2: #ffb800; --danger: #a83a32; --white: #ffffff;
      --shadow: 0 18px 45px rgba(20, 55, 31, .13);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
      background: radial-gradient(circle at 12% 8%, rgba(255,184,0,.18), transparent 28%),
                  linear-gradient(135deg, #f4fff2 0%, #eef9ee 42%, #fffdf2 100%);
      color: var(--ink);
      padding: 28px;
    }
    .shell { max-width: 1520px; margin: 0 auto; }
    .hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; align-items: stretch; margin-bottom: 18px; }
    .title-card, .note-card, .block { background: rgba(255,255,255,.88); border: 1px solid rgba(24,122,63,.20); box-shadow: var(--shadow); border-radius: 22px; overflow: hidden; }
    .title-card { padding: 24px 28px; position: relative; }
    .title-card:before { content: ""; position: absolute; inset: 0 auto 0 0; width: 10px; background: linear-gradient(var(--accent), var(--accent-2)); }
    .eyebrow { font-size: 12px; letter-spacing: .28em; color: var(--accent); font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 48px); letter-spacing: .15em; line-height: 1.05; font-weight: 900; }
    .sub { margin: 12px 0 0; color: var(--muted); line-height: 1.7; }
    .note-card { padding: 20px 22px; }
    .note-card h2 { margin: 0 0 10px; font-size: 18px; }
    .formula { display: grid; gap: 8px; font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; line-height: 1.55; color: #12341f; }
    .formula div { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 8px 10px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    button, .button-like { appearance: none; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--ink); color: var(--white); font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(17,32,24,.16); transition: transform .15s ease, box-shadow .15s ease, background .15s ease; font-family: inherit; font-size: 14px; }
    button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(17,32,24,.20); }
    button.secondary { background: var(--accent); }
    button.ghost { background: #e8f4e8; color: var(--ink); box-shadow: none; border: 1px solid var(--line); }
    button.warn { background: var(--danger); }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; padding: 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); padding: 9px 10px; font: 14px/1.35 inherit; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(24,122,63,.12); }
    input[readonly] { background: #f5f8f5; color: #35513d; }
    .table-wrap { overflow: auto; max-height: 58vh; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; min-width: 1480px; }
    th, td { border: 1px solid #8ea994; padding: 5px; text-align: center; vertical-align: middle; font-size: 13px; background: rgba(255,255,255,.75); }
    th { position: sticky; top: 0; z-index: 2; background: #cfead0; font-weight: 900; color: #0e2a17; white-space: nowrap; }
    td.left, th.left { text-align: left; }
    td.result { background: #f4fff4; font-weight: 800; }
    td.money, input.money { text-align: right; font-variant-numeric: tabular-nums; }
    td input, td select { border-radius: 6px; padding: 6px; font-size: 13px; }
    .row-action { min-width: 54px; }
    .tiny { padding: 6px 9px; font-size: 12px; box-shadow: none; }
    .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 18px; background: linear-gradient(135deg, rgba(215,239,216,.95), rgba(255,255,255,.9)); }
    .metric { border: 1px solid rgba(24,122,63,.18); background: var(--white); border-radius: 18px; padding: 14px 16px; min-height: 86px; }
    .metric b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .metric strong { font-size: 24px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
    .metric.highlight { border-color: rgba(255,184,0,.55); background: #fffaf0; }
    .metric.profit strong.negative { color: var(--danger); }
    .fees { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; padding: 18px; border-top: 1px solid var(--line); background: rgba(255,255,255,.72); }
    .tips { margin-top: 14px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .tips strong { color: var(--ink); }
    @media (max-width: 980px) { body { padding: 14px; } .hero, .grid, .totals, .fees { grid-template-columns: 1fr; } .table-wrap { max-height: none; } }
    @media print { body { background: white; padding: 0; } .toolbar, .note-card, button { display: none !important; } .title-card, .block { box-shadow: none; border-radius: 0; } .table-wrap { max-height: none; overflow: visible; } input, select { border: 0; background: transparent; padding: 0; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>
</head>
<body>

  <!-- 登录区域 -->
  <div id="authContainer" style="margin-bottom:20px;">
    <input id="email" placeholder="邮箱">
    <input id="password" type="password" placeholder="密码">
    <button onclick="signUp()">注册</button>
    <button onclick="signIn()">登录</button>
    <button onclick="signOut()">登出</button>
    <span id="userInfo" style="margin-left:10px;"></span>
  </div>

  <main class="shell">
    <!-- 原 HTML 内容保持不变，包含 hero, table, form, totals 等 -->
  </main>

  <script>
    // 初始化 Supabase
    const supabaseUrl = 'https://fswvklhzhmxlksaujjdx.supabase.co';
    const supabaseKey = 'sb_publishable_Jq7ON0RXGU37LrC25dZh5Q_fq12N9SI';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 登录/注册功能
    async function signUp() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) alert(error.message);
      else alert('注册成功，请检查邮箱验证');
      updateUserInfo();
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else alert('登录成功');
      updateUserInfo();
    }

    async function signOut() {
      await supabase.auth.signOut();
      updateUserInfo();
    }

    async function updateUserInfo() {
      const user = (await supabase.auth.getUser()).data.user;
      document.getElementById('userInfo').textContent = user ? `已登录: ${user.email}` : '未登录';
    }

    // 原有计算功能保留
    /* rowTemplate, addRow, addFeeRow, deleteRow, renumber, recalc, collectData, saveLocal, loadLocal, resetAll, exportCsv */

    // 云端保存功能
    async function saveToSupabase() {
      const user = (await supabase.auth.getUser()).data.user;
      if (!user) return;
      const data = collectData();
      const { error } = await supabase.from('orders').insert([{
        user_email: user.email,
        customer: data.fields.customer,
        usd_amount: data.fields.exportUsd,
        refund_amount: Number(document.getElementById('refundTotal').textContent.replace('¥','').replaceAll(',','')),
        profit: Number(document.getElementById('profitTotal').textContent.replace('¥','').replaceAll(',',''))
      }]);
      if (error) console.error('Supabase 保存错误:', error);
    }

    function recalcAndSave() {
      recalc();
      saveToSupabase();
    }

    document.querySelectorAll('input,select').forEach(el => el.addEventListener('input', recalcAndSave));

    loadLocal();
    updateUserInfo();
  </script>
</body>
</html>
